<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#101411">
  <title>毛豆 — 让想法变成作品</title>
  <style>
    :root { color-scheme: dark; --bg: #101411; --panel: #191f1a; --text: #f0f4ec; --muted: #a3afa2; --accent: #b9ee8d; --line: rgba(225, 243, 220, .11); }
    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body { margin: 0; background: var(--bg); color: var(--text); font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Microsoft YaHei", sans-serif; line-height: 1.6; }
    a { color: inherit; text-decoration: none; }
    .wrap { width: min(1120px, calc(100% - 48px)); margin: 0 auto; }
    header { border-bottom: 1px solid var(--line); }
    nav { height: 76px; display: flex; align-items: center; justify-content: space-between; }
    .brand { display: flex; align-items: center; gap: 10px; font-size: 19px; font-weight: 750; letter-spacing: .04em; }
    .mark { width: 25px; height: 25px; display: grid; place-items: center; background: var(--accent); color: #142015; border-radius: 8px 13px 8px 13px; font-size: 15px; }
    .nav-link { color: var(--muted); font-size: 14px; }
    .nav-link:hover { color: var(--text); }
    .hero { position: relative; overflow: hidden; padding: 132px 0 120px; }
    .hero::before { content: ""; position: absolute; width: 510px; height: 510px; right: -150px; top: -145px; border-radius: 50%; background: radial-gradient(circle, rgba(151, 210, 113, .14), transparent 70%); pointer-events: none; }
    .eyebrow { display: inline-flex; align-items: center; gap: 8px; color: var(--accent); font-size: 13px; letter-spacing: .12em; }
    .eyebrow::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: var(--accent); }
    h1 { margin: 20px 0 12px; font-size: clamp(64px, 12vw, 120px); line-height: 1; letter-spacing: -.06em; }
    .tagline { margin: 0; font-size: clamp(24px, 4vw, 38px); font-weight: 600; letter-spacing: -.03em; }
    .intro { max-width: 560px; margin: 24px 0 34px; color: var(--muted); font-size: 16px; line-height: 1.9; }
    .button { display: inline-flex; align-items: center; gap: 28px; padding: 13px 19px; border-radius: 9px; background: var(--accent); color: #172315; font-size: 14px; font-weight: 700; transition: transform .2s, background .2s; }
    .button:hover { transform: translateY(-2px); background: #c9f6a4; }
    .features { padding: 0 0 100px; }
    .section-head { display: flex; justify-content: space-between; align-items: end; gap: 20px; margin-bottom: 22px; }
    h2 { margin: 0; font-size: 24px; letter-spacing: -.03em; }
    .section-head p { margin: 0; color: var(--muted); font-size: 14px; }
    .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; }
    .card { min-height: 190px; padding: 25px; border: 1px solid var(--line); border-radius: 14px; background: var(--panel); }
    .card-number { color: var(--accent); font-size: 12px; font-weight: 700; letter-spacing: .1em; }
    .card h3 { margin: 25px 0 8px; font-size: 18px; }
    .card p { margin: 0; color: var(--muted); font-size: 14px; line-height: 1.8; }
    footer { border-top: 1px solid var(--line); color: #7f8d80; font-size: 13px; }
    .footer-inner { padding: 23px 0; display: flex; justify-content: space-between; gap: 16px; }
    a:focus-visible { outline: 2px solid var(--accent); outline-offset: 4px; }
    @media (max-width: 700px) { .wrap { width: min(100% - 36px, 1120px); } nav { height: 66px; } .hero { padding: 90px 0 85px; } .grid { grid-template-columns: 1fr; } .card { min-height: 0; } .section-head { align-items: start; flex-direction: column; gap: 6px; } .features { padding-bottom: 70px; } .footer-inner { flex-direction: column; gap: 3px; } }
  </style>
</head>
<body>
  <header>
    <nav class="wrap" aria-label="主导航">
      <a class="brand" href="#top"><span class="mark" aria-hidden="true">●</span>毛豆</a>
      <a class="nav-link" href="#features">探索能力 ↓</a>
    </nav>
  </header>
  <main id="top">
    <section class="hero wrap">
      <div class="eyebrow">让创意自然生长</div>
      <h1>毛豆</h1>
      <p class="tagline">说出想法，创造作品。</p>
      <p class="intro">用自然语言，把灵感变成文档、幻灯片、图片或代码。从一个简单的念头开始，让创作更轻松。</p>
      <a class="button" href="#features">看看能做什么 <span aria-hidden="true">↗</span></a>
    </section>
    <section class="features wrap" id="features">
      <div class="section-head"><h2>从想法，到成果</h2><p>创作、调整、继续完善。</p></div>
      <div class="grid">
        <article class="card"><span class="card-number">01 / 内容创作</span><h3>写作与表达</h3><p>整理文字，制作文档和幻灯片，也能生成图片。</p></article>
        <article class="card"><span class="card-number">02 / 创意开发</span><h3>代码与交互</h3><p>编写代码，制作网页、游戏与插件，让点子动起来。</p></article>
        <article class="card"><span class="card-number">03 / 持续完善</span><h3>计算与修改</h3><p>完成计算和绘图，在产物面板查看成果并继续修改。</p></article>
      </div>
    </section>
  </main>
  <footer><div class="wrap footer-inner"><span>毛豆 · 让想法变成作品</span><span>从一句话开始。</span></div></footer>
</body>
</html>
